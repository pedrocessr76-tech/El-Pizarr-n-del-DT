<!DOCTYPE html><html lang="es"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Login - El Pizarrón del DT</title>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&amp;display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; background-color: #111316; font-family: 'Inter', sans-serif; color: #e2e2e6; overflow: hidden; }
  * { box-sizing: border-box; }
</style>
</head>
<body style="margin:0; padding:0; background-color:#111316; display:flex; align-items:center; justify-center:center; min-height:100vh;">
<main style="position:fixed; top:0; left:0; right:0; bottom:0; width:100vw; height:100vh; background-color:#111316; display:flex; align-items:center; justify-content:center; z-index:9999; padding:16px;">

  <!-- Subtle Tactical Grid Overlay -->
  <svg style="position:absolute; inset:0; width:100%; height:100%; opacity:0.1; pointer-events:none;" preserveAspectRatio="none" viewBox="0 0 1000 1000">
    <path d="M-100,550 Q450,200 1100,750" fill="none" stroke="#39ff14" stroke-dasharray="6 6" stroke-width="1.5"></path>
  </svg>

  <!-- Centered Login Card -->
  <div style="position:relative; z-index:10; width:400px; max-width:92vw; background-color:#1e2023; border-radius:24px; border:1px solid rgba(255,255,255,0.1); padding:36px 32px; box-shadow:0 25px 50px -12px rgba(0,0,0,0.7); display:flex; flex-direction:column; margin:auto;">
    
    <!-- Logo & Header -->
    <div style="display:flex; flex-direction:column; align-items:center; text-align:center; margin-bottom:24px;">
      <div style="position:relative; width:80px; height:80px; margin-bottom:12px; display:flex; align-items:center; justify-content:center;">
        <div style="position:absolute; top:0; left:0; right:0; bottom:0; background-color:rgba(57,255,20,0.2); filter:blur(20px); border-radius:9999px;"></div>
        <img alt="El Pizarrón del DT Logo" src="https://lh3.googleusercontent.com/aida/AP1WRLt2arhaseVvop9MHRP9DiFnCDYGYTiQ-8mLBYDI4pwK1b6gEaz0N-CPHKoYou-NC-yeoW_0ld2aMbsvkUv2OF_6U33QA-1O5a67efWmV6XOg7d4Z2N5I_558aOteJR9l8SnLQWnkuOCoIj5C_uxHaP2K4zJJha3l7nC3nYCv21GFRcCAI1r95EviZLXEf0XfzZ687dzeH_dnCxtVuTV12RxMAfwuWe1KFTar6ZFKSvbiZm4G4D7XV9xCm4" style="position:relative; width:100%; height:100%; object-fit:contain; filter:drop-shadow(0 0 10px rgba(57,255,20,0.4));">
      </div>
      <span style="color:#39ff14; font-size:11px; text-transform:uppercase; letter-spacing:0.25em; font-weight:800; margin-bottom:4px; display:block;">INTELLIGENCE SYSTEM</span>
      <h1 style="font-size:28px; font-weight:800; color:#ffffff; margin:0; letter-spacing:-0.02em;">Acceso Táctico</h1>
    </div>

    <!-- Login Form -->
    <form onsubmit="return false;" style="display:flex; flex-direction:column; gap:18px;">
      <div style="display:flex; flex-direction:column; gap:6px;">
        <label for="email" style="font-size:12px; font-weight:600; color:#d1d5db; margin-left:2px;">Usuario / Email</label>
        <div style="position:relative; display:flex; align-items:center;">
          <span class="material-symbols-outlined" style="position:absolute; left:14px; color:#9ca3af; font-size:20px; pointer-events:none;">person</span>
          <input id="email" placeholder="coach.javier@el-piza..." type="text" style="width:100%; background-color:#282a2d; border:1px solid rgba(255,255,255,0.1); border-radius:12px; padding:12px 14px 12px 44px; color:#ffffff; font-size:14px; outline:none;">
        </div>
      </div>

      <div style="display:flex; flex-direction:column; gap:6px;">
        <label for="password" style="font-size:12px; font-weight:600; color:#d1d5db; margin-left:2px;">Contraseña</label>
        <div style="position:relative; display:flex; align-items:center;">
          <span class="material-symbols-outlined" style="position:absolute; left:14px; color:#9ca3af; font-size:20px; pointer-events:none;">lock</span>
          <input id="password" placeholder="••••••••" type="password" style="width:100%; background-color:#282a2d; border:1px solid rgba(255,255,255,0.1); border-radius:12px; padding:12px 44px 12px 44px; color:#ffffff; font-size:14px; outline:none;">
          <button type="button" style="position:absolute; right:14px; background:none; border:none; color:#9ca3af; cursor:pointer; padding:0; display:flex; align-items:center;">
            <span class="material-symbols-outlined" style="font-size:20px;">visibility</span>
          </button>
        </div>
      </div>

      <div style="display:flex; align-items:center; justify-content:space-between; padding-top:4px;">
        <label style="display:flex; align-items:center; gap:8px; cursor:pointer;">
          <input type="checkbox" checked style="accent-color:#39ff14; width:16px; height:16px;">
          <span style="font-size:12px; color:#9ca3af;">Mantener sesión</span>
        </label>
        <a href="#" style="font-size:12px; color:#00e3fd; text-decoration:none; font-weight:600;">¿Olvidaste tu contraseña?</a>
      </div>

      <button type="submit" style="width:100%; background-color:#39ff14; color:#053900; font-weight:900; font-size:14px; padding:14px; border-radius:12px; border:none; cursor:pointer; box-shadow:0 0 25px rgba(57,255,20,0.4); text-transform:uppercase; letter-spacing:0.05em; margin-top:6px;">
        INICIAR SESIÓN
      </button>
    </form>

    <!-- Footer -->
    <div style="margin-top:28px; padding-top:20px; border-top:1px solid rgba(255,255,255,0.08); text-align:center;">
      <p style="font-size:12px; color:#9ca3af; margin:0;">
        ¿Nuevo en el cuerpo técnico? 
        <a href="#" style="color:#39ff14; font-weight:800; text-decoration:none; margin-left:4px;">Crear una cuenta</a>
      </p>
    </div>
  </div>
</main>
</body></html>
