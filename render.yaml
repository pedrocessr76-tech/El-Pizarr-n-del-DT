services:
  - type: web
    name: el-pizarron-api
    runtime: node
    region: virginia
    plan: free
    buildCommand: npm ci && npm run build --workspace=server
    startCommand: npm run start --workspace=server
    healthCheckPath: /health/b2b
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: DB_HOST
        fromDatabase:
          name: el-pizarron-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: el-pizarron-db
          property: port
      - key: DB_USER
        fromDatabase:
          name: el-pizarron-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: el-pizarron-db
          property: password
      - key: DB_NAME
        fromDatabase:
          name: el-pizarron-db
          property: database
      - key: DB_SSL
        value: true
      # El esquema del juego se versiona con migraciones (apps/server/src/migrations).
      # synchronize queda deshabilitado: en producción puede borrar columnas con datos.
      - key: DB_SYNCHRONIZE
        value: false
      - key: DB_MIGRATIONS
        value: true
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        fromService:
          type: web
          name: el-pizarron-web
          envVarKey: RENDER_EXTERNAL_URL
      # B2B: misma instancia Free de Render (el-pizarron-db), base lógica independiente.
      # URL pública del cliente: arma el enlace del email de verificación.
      # Si queda vacía, el link sale con el default http://localhost:5173.
      - key: B2B_PUBLIC_URL
        fromService:
          type: web
          name: el-pizarron-web
          envVarKey: RENDER_EXTERNAL_URL
      - key: B2B_DB_HOST
        fromDatabase:
          name: el-pizarron-db
          property: host
      - key: B2B_DB_PORT
        fromDatabase:
          name: el-pizarron-db
          property: port
      - key: B2B_DB_USER
        fromDatabase:
          name: el-pizarron-db
          property: user
      - key: B2B_DB_PASSWORD
        fromDatabase:
          name: el-pizarron-db
          property: password
      - key: B2B_DB_NAME
        value: sistema_canchas
      - key: B2B_DB_SSL
        value: true
      - key: B2B_DB_SYNCHRONIZE
        value: false
      - key: B2B_DB_MIGRATIONS
        value: true
      # Seed B2B: solo desarrollo. En producción el seed se ignora además por
      # NODE_ENV=production (apps/server/src/b2b/b2b-seed.service.ts). El alta
      # inicial del propietario se hace por POST /api/v1/auth/onboarding, sin
      # credenciales demo conocidas.
      - key: B2B_SEED
        value: false
      - key: B2B_JWT_SECRET
        generateValue: true
      # Recordatorios #34: email automático 24 h antes y aviso de WhatsApp
      # manual 30 min antes. El aviso de WhatsApp no se envía desde acá: lo
      # despacha el personal con un deep link wa.me, así que este canal queda en
      # 'log' de forma permanente.
      - key: MESSAGING_PROVIDER_EMAIL
        sync: false
      - key: MESSAGING_PROVIDER_WHATSAPP
        value: log
      # SMTP del mailbox del complejo. Si queda vacío, el canal de email cae a
      # 'log': los recordatorios se registran como simulados y el dashboard lo
      # advierte, sin romper el arranque.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: 587
      - key: SMTP_SECURE
        value: false
      - key: SMTP_FROM
        sync: false
      - key: SMTP_FROM_NAME
        value: Sistema Canchas
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false

  - type: web
    name: el-pizarron-web
    runtime: static
    buildCommand: npm ci && npm run build --workspace=client
    staticPublishPath: apps/client/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: VITE_API_URL
        fromService:
          type: web
          name: el-pizarron-api
          envVarKey: RENDER_EXTERNAL_URL
      - key: VITE_B2B_ENABLED
        value: true

databases:
  - name: el-pizarron-db
    region: virginia
    plan: free
