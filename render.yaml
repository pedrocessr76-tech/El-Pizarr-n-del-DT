services:
  - type: web
    name: el-pizarron-api
    runtime: node
    region: virginia
    plan: free
    buildCommand: npm ci && npm run build --workspace=server
    startCommand: npm run start --workspace=server
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: DB_HOST
        fromDatabase:
          name: el-pizarron-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: el-pizarron-db
          property: port
      - key: DB_USER
        fromDatabase:
          name: el-pizarron-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: el-pizarron-db
          property: password
      - key: DB_NAME
        fromDatabase:
          name: el-pizarron-db
          property: database
      - key: DB_SSL
        value: true
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        fromService:
          type: web
          name: el-pizarron-web
          envVarKey: RENDER_EXTERNAL_URL

  - type: web
    name: el-pizarron-web
    runtime: static
    buildCommand: npm ci && npm run build --workspace=client
    staticPublishPath: apps/client/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: VITE_API_URL
        fromService:
          type: web
          name: el-pizarron-api
          envVarKey: RENDER_EXTERNAL_URL

databases:
  - name: el-pizarron-db
    region: virginia
    plan: free
