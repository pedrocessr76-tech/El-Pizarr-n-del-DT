services:
  - type: web
    name: el-pizarron-api
    runtime: node
    region: virginia
    plan: free
    buildCommand: npm ci && npm run build --workspace=server
    startCommand: npm run start --workspace=server
    healthCheckPath: /health/b2b
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: DB_HOST
        fromDatabase:
          name: el-pizarron-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: el-pizarron-db
          property: port
      - key: DB_USER
        fromDatabase:
          name: el-pizarron-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: el-pizarron-db
          property: password
      - key: DB_NAME
        fromDatabase:
          name: el-pizarron-db
          property: database
      - key: DB_SSL
        value: true
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        fromService:
          type: web
          name: el-pizarron-web
          envVarKey: RENDER_EXTERNAL_URL
      # B2B: misma instancia Render durante el MVP, base lógica independiente.
      - key: B2B_DB_HOST
        fromDatabase:
          name: el-pizarron-db
          property: host
      - key: B2B_DB_PORT
        fromDatabase:
          name: el-pizarron-db
          property: port
      - key: B2B_DB_USER
        fromDatabase:
          name: el-pizarron-db
          property: user
      - key: B2B_DB_PASSWORD
        fromDatabase:
          name: el-pizarron-db
          property: password
      - key: B2B_DB_NAME
        value: sistema_canchas
      - key: B2B_DB_SSL
        value: true
      - key: B2B_DB_SYNCHRONIZE
        value: false
      - key: B2B_DB_MIGRATIONS
        value: true
      - key: B2B_SEED
        value: true
      - key: B2B_SEED_EMAIL
        value: admin@lacancha.com.ar
      - key: B2B_SEED_PASSWORD
        generateValue: true
      - key: B2B_SEED_CLIENT_EMAIL
        value: cliente@lacancha.com.ar
      - key: B2B_SEED_CLIENT_PASSWORD
        generateValue: true
      - key: B2B_JWT_SECRET
        generateValue: true

  - type: web
    name: el-pizarron-web
    runtime: static
    dependencies:
      - name: el-pizarron-api
    buildCommand: npm ci && npm run build --workspace=client
    staticPublishPath: apps/client/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: VITE_API_URL
        fromService:
          type: web
          name: el-pizarron-api
          envVarKey: RENDER_EXTERNAL_URL
      - key: VITE_B2B_ENABLED
        value: true

databases:
  - name: el-pizarron-db
    region: virginia
    plan: free
