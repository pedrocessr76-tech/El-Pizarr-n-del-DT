services:
  db:
    image: postgres:16-alpine
    container_name: pizarron_dt_db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=pizarron_dt
      - POSTGRES_USER=pizarron
      - POSTGRES_PASSWORD=pizarron
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pizarron -d pizarron_dt"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    container_name: pizarron_dt_server
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - NODE_ENV=development
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=pizarron
      - DB_PASSWORD=pizarron
      - DB_NAME=pizarron_dt
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  client:
    build:
      context: .
      dockerfile: apps/client/Dockerfile
    container_name: pizarron_dt_client
    ports:
      - "5173:5173"
    environment:
      - VITE_PROXY_TARGET=http://server:3001
      - DOCKER_ENV=true
    depends_on:
      - server
    restart: unless-stopped

volumes:
  pg_data:
