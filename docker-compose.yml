services:
  db:
    image: postgres:16-alpine
    container_name: pizarron_dt_db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=pizarron_dt
      - POSTGRES_USER=pizarron
      - POSTGRES_PASSWORD=pizarron
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pizarron -d pizarron_dt"]
      interval: 5s
      timeout: 5s
      retries: 10

  b2b-db:
    image: postgres:16-alpine
    container_name: sistema_canchas_db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=sistema_canchas
      - POSTGRES_USER=canchas
      - POSTGRES_PASSWORD=canchas
    ports:
      - "5433:5432"
    volumes:
      - b2b_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U canchas -d sistema_canchas"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis-cache:
    image: redis:7-alpine
    container_name: pizarron_dt_cache
    restart: unless-stopped
    ports:
      - "6379:6379"

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    container_name: pizarron_dt_server
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - NODE_ENV=development
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=pizarron
      - DB_PASSWORD=pizarron
      - DB_NAME=pizarron_dt
      # En desarrollo synchronize crea el esquema; las migraciones quedan para producción.
      - DB_SYNCHRONIZE=true
      - DB_MIGRATIONS=false
      - RESULT_CACHE_REDIS_URL=redis://redis-cache:6379
      - DB_CACHE_ENABLED=${DB_CACHE_ENABLED:-false}
      - B2B_DB_CACHE_ENABLED=${B2B_DB_CACHE_ENABLED:-false}
      - DB_CACHE_TTL_MS=${DB_CACHE_TTL_MS:-60000}
      - B2B_DB_CACHE_TTL_MS=${B2B_DB_CACHE_TTL_MS:-60000}
      - B2B_DB_HOST=b2b-db
      - B2B_DB_PORT=5432
      - B2B_DB_USER=canchas
      - B2B_DB_PASSWORD=canchas
      - B2B_DB_NAME=sistema_canchas
      - B2B_DB_SYNCHRONIZE=true
      # Secrets JWT obligatorios (hallazgo P0 del informe): se toman del .env del
      # repo (docker compose la lee automáticamente). Sin ellos el contenedor
      # falla con un error claro en lugar de firmar tokens con una clave pública.
      - JWT_SECRET=${JWT_SECRET:?Definí JWT_SECRET en .env (más de 32 caracteres)}
      - B2B_JWT_SECRET=${B2B_JWT_SECRET:?Definí B2B_JWT_SECRET en .env (más de 32 caracteres)}
      # Seed B2B desactivado a propósito: en cada arranque recreaba los usuarios
      # demo (admin@ / cliente@lacancha.com.ar) y pisaba la base de pruebas. El
      # alta de usuario y complejo se hace por POST /api/v1/auth/onboarding.
      - B2B_SEED=false
      # Base pública del cliente B2B: es la que se arma en el enlace de
      # verificación de email. Sin ella el link cae al default del server
      # (http://localhost:5173) y en producción apuntaría al dominio equivocado.
      - B2B_PUBLIC_URL=${B2B_PUBLIC_URL:-http://localhost:5173}
      # Envío de emails: verificación de cuenta y recordatorios (#34). Con el
      # proveedor en `log` el servidor arranca igual pero nadie recibe nada y el
      # enlace de verificación queda escrito en los logs.
      - MESSAGING_PROVIDER_EMAIL=${MESSAGING_PROVIDER_EMAIL:-log}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_SECURE=${SMTP_SECURE:-false}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM=${SMTP_FROM:-}
      - SMTP_FROM_NAME=${SMTP_FROM_NAME:-Sistema Canchas}
    depends_on:
      db:
        condition: service_healthy
      b2b-db:
        condition: service_healthy
    restart: unless-stopped

  client:
    build:
      context: .
      dockerfile: apps/client/Dockerfile
    container_name: pizarron_dt_client
    ports:
      - "5173:5173"
    environment:
      - VITE_PROXY_TARGET=http://server:3001
      - DOCKER_ENV=true
    depends_on:
      - server
    restart: unless-stopped

volumes:
  pg_data:
  b2b_pg_data:
