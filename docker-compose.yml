services:
  db:
    image: postgres:16-alpine
    container_name: pizarron_dt_db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=pizarron_dt
      - POSTGRES_USER=pizarron
      - POSTGRES_PASSWORD=pizarron
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pizarron -d pizarron_dt"]
      interval: 5s
      timeout: 5s
      retries: 10

  b2b-db:
    image: postgres:16-alpine
    container_name: sistema_canchas_db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=sistema_canchas
      - POSTGRES_USER=canchas
      - POSTGRES_PASSWORD=canchas
    ports:
      - "5433:5432"
    volumes:
      - b2b_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U canchas -d sistema_canchas"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    container_name: pizarron_dt_server
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - NODE_ENV=development
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=pizarron
      - DB_PASSWORD=pizarron
      - DB_NAME=pizarron_dt
      # En desarrollo synchronize crea el esquema; las migraciones quedan para producción.
      - DB_SYNCHRONIZE=true
      - DB_MIGRATIONS=false
      - B2B_DB_HOST=b2b-db
      - B2B_DB_PORT=5432
      - B2B_DB_USER=canchas
      - B2B_DB_PASSWORD=canchas
      - B2B_DB_NAME=sistema_canchas
      - B2B_DB_SYNCHRONIZE=true
      # Secrets JWT obligatorios (hallazgo P0 del informe): se toman del .env del
      # repo (docker compose la lee automáticamente). Sin ellos el contenedor
      # falla con un error claro en lugar de firmar tokens con una clave pública.
      - JWT_SECRET=${JWT_SECRET:?Definí JWT_SECRET en .env (más de 32 caracteres)}
      - B2B_JWT_SECRET=${B2B_JWT_SECRET:?Definí B2B_JWT_SECRET en .env (más de 32 caracteres)}
      # Seed B2B: solo desarrollo (NODE_ENV=development). En producción se ignora
      # y las altas de propietario van por POST /api/v1/auth/onboarding.
      - B2B_SEED=true
      - B2B_SEED_EMAIL=admin@lacancha.com.ar
      - B2B_SEED_PASSWORD=canchas-demo
      - B2B_SEED_CLIENT_EMAIL=cliente@lacancha.com.ar
      - B2B_SEED_CLIENT_PASSWORD=canchas-client
    depends_on:
      db:
        condition: service_healthy
      b2b-db:
        condition: service_healthy
    restart: unless-stopped

  client:
    build:
      context: .
      dockerfile: apps/client/Dockerfile
    container_name: pizarron_dt_client
    ports:
      - "5173:5173"
    environment:
      - VITE_PROXY_TARGET=http://server:3001
      - DOCKER_ENV=true
    depends_on:
      - server
    restart: unless-stopped

volumes:
  pg_data:
  b2b_pg_data:
